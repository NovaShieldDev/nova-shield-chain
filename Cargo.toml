[workspace]
resolver = "2"
exclude = ["fuzz"]
members = [
    "crates/nova-primitives",
    "crates/nova-crypto",
    "crates/nova-mpc",
    "crates/nova-mempool",
    "crates/nova-auction",
    "crates/nova-account",
    "crates/nova-inheritance",
    "crates/nova-freeze",
    "crates/nova-consensus",
    "crates/nova-runtime",
    "crates/nova-zk",
    "crates/nova-guardian",
    "crates/nova-vm",
    "crates/nova-network",
    "crates/nova-guard",
    "crates/nova-sdk",
    "crates/nova-node",
    "crates/nova-rpc",
    "crates/nova-testing",
    "crates/nova-benchmarks",
    "crates/nova-security-audit",
]

[workspace.package]
version      = "0.1.0"
edition      = "2021"
rust-version = "1.85.0"
authors      = ["Nova Shield Chain Contributors"]
license      = "Apache-2.0"
repository   = "https://github.com/nova-shield-chain/nova-shield-chain"

# ─── Paylaşılan bağımlılıklar (tüm crate'ler buradan referans alır) ───────────
[workspace.dependencies]

# Nova iç crate'ler
nova-primitives = { path = "crates/nova-primitives" }
nova-crypto     = { path = "crates/nova-crypto" }
nova-mpc        = { path = "crates/nova-mpc" }
nova-mempool    = { path = "crates/nova-mempool" }
nova-auction    = { path = "crates/nova-auction" }
nova-account    = { path = "crates/nova-account" }
nova-inheritance = { path = "crates/nova-inheritance" }
nova-freeze     = { path = "crates/nova-freeze" }
nova-consensus  = { path = "crates/nova-consensus" }
nova-runtime    = { path = "crates/nova-runtime" }
nova-zk         = { path = "crates/nova-zk" }
nova-guardian   = { path = "crates/nova-guardian" }
nova-vm         = { path = "crates/nova-vm" }
nova-network    = { path = "crates/nova-network" }
nova-guard      = { path = "crates/nova-guard" }
nova-sdk        = { path = "crates/nova-sdk" }
nova-node       = { path = "crates/nova-node" }
nova-rpc        = { path = "crates/nova-rpc" }
nova-testing    = { path = "crates/nova-testing" }
nova-benchmarks     = { path = "crates/nova-benchmarks" }
nova-security-audit = { path = "crates/nova-security-audit" }

# ─── Kriptografi ──────────────────────────────────────────────────────────────
blake3          = { version = "1.5", features = ["rayon"] }
sha2            = { version = "0.10", default-features = false }
sha3            = { version = "0.10", default-features = false }
hmac            = { version = "0.12", default-features = false }
hkdf            = { version = "0.12", default-features = false }

# Eliptik eğri kriptografisi
k256            = { version = "0.13", features = ["ecdsa", "schnorr", "arithmetic"] }
p256            = { version = "0.13", features = ["ecdsa", "arithmetic"] }
curve25519-dalek = { version = "4.1", features = ["serde", "rand_core"] }
ed25519-dalek   = { version = "2.1", features = ["rand_core", "serde"] }
x25519-dalek    = { version = "2.0", features = ["serde", "static_secrets"] }
schnorrkel       = { version = "0.11", features = ["getrandom"] }

# BLS12-381
blst            = { version = "0.3" }
bls12_381       = { version = "0.8" }
pairing         = { version = "0.23" }

# Post-quantum
pqcrypto-dilithium = { version = "0.5" }
pqcrypto-traits    = { version = "0.3" }

# ZK kanıt sistemleri
ark-ff          = { version = "0.4", default-features = false, features = ["std"] }
ark-ec          = { version = "0.4", default-features = false, features = ["std"] }
ark-std         = { version = "0.4", features = ["std"] }
ark-serialize   = { version = "0.4", default-features = false, features = ["derive", "std"] }
ark-bn254       = { version = "0.4", features = ["std"] }
ark-bls12-381   = { version = "0.4", features = ["std"] }
ark-groth16     = { version = "0.4", features = ["std", "r1cs"] }
ark-poly        = { version = "0.4", features = ["std"] }
ark-poly-commit = { version = "0.4", features = ["std"] }
ark-relations   = { version = "0.4", features = ["std"] }
ark-r1cs-std    = { version = "0.4", features = ["std"] }
ark-snark       = { version = "0.4", default-features = false }

# Simetrik şifreleme
aes-gcm         = { version = "0.10", default-features = false, features = ["aes", "alloc"] }
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }

# ─── Seri/Deserializasyon ──────────────────────────────────────────────────────
serde           = { version = "1.0", features = ["derive"] }
serde_json      = { version = "1.0" }
borsh           = { version = "1.5", features = ["derive"] }
bincode         = { version = "1.3" }
parity-scale-codec = { version = "3.6", features = ["derive"] }

# ─── Asenkron runtime ──────────────────────────────────────────────────────────
tokio           = { version = "1.40", features = ["full"] }
tokio-stream    = { version = "0.1" }
futures         = { version = "0.3" }
async-trait     = { version = "0.1" }
pin-project     = { version = "1.1" }

# ─── P2P ağ ────────────────────────────────────────────────────────────────────
libp2p          = { version = "0.54", features = [
    "tcp", "dns", "noise", "yamux", "gossipsub", "kad", "identify",
    "ping", "request-response", "tokio",
] }

# ─── Depolama ──────────────────────────────────────────────────────────────────
rocksdb         = { version = "0.22", features = ["multi-threaded-cf"] }

# ─── Paralel hesaplama ──────────────────────────────────────────────────────────
rayon           = { version = "1.10" }
dashmap         = { version = "6.1", features = ["serde"] }
crossbeam-channel = { version = "0.5" }
parking_lot     = { version = "0.12", features = ["serde"] }

# ─── Hata yönetimi ──────────────────────────────────────────────────────────────
thiserror       = { version = "1.0" }
anyhow          = { version = "1.0" }

# ─── Loglama / Metrik ──────────────────────────────────────────────────────────
tracing         = { version = "0.1" }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
metrics         = { version = "0.23" }
metrics-exporter-prometheus = { version = "0.15" }

# ─── Sayısal / Yardımcı ──────────────────────────────────────────────────────
rand            = { version = "0.8", features = ["std_rng"] }
rand_core       = { version = "0.6", features = ["getrandom"] }
zeroize         = { version = "1.8", features = ["derive", "zeroize_derive"] }
subtle          = { version = "2.6" }
num-bigint      = { version = "0.4" }
num-traits      = { version = "0.2" }
num-integer     = { version = "0.1" }
hex             = { version = "0.4" }
bs58            = { version = "0.5" }
base64          = { version = "0.22" }

# ─── CLI / RPC ────────────────────────────────────────────────────────────────
clap            = { version = "4.5", features = ["derive"] }
jsonrpsee       = { version = "0.24", features = ["server", "client", "ws-client"] }
ureq            = { version = "2.10", features = ["json"] }
tonic           = { version = "0.12" }
prost           = { version = "0.13" }
axum            = { version = "0.7" }

# ─── VM ────────────────────────────────────────────────────────────────────────
wasmtime        = { version = "25.0", features = ["cranelift"] }
revm            = { version = "14.0", features = ["serde"] }
wat             = { version = "1.0" }

# ─── Ağ / Erasure ──────────────────────────────────────────────────────────────
reed-solomon-erasure = { version = "6.0" }

# ─── Test ──────────────────────────────────────────────────────────────────────
proptest        = { version = "1.5" }
criterion       = { version = "0.5", features = ["html_reports"] }
rstest          = { version = "0.23" }
mockall         = { version = "0.13" }

[profile.release]
opt-level       = 3
lto             = "thin"
codegen-units   = 1
panic           = "abort"
strip           = "debuginfo"

[profile.dev]
opt-level       = 0
debug           = true

[profile.testnet]
inherits        = "release"
debug           = true
strip           = "none"

[profile.bench]
inherits        = "release"
debug           = false
